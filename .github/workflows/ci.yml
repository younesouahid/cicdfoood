name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récuperer le code
        uses: actions/checkout@v3

      - name: Installe Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        run: npm ci

      - name: Verifier le code
        run: npm run lint

      - name: Executer les test
        run: npm test

      - name: construire l'image docker
        run: docker build -t cicdfood .

      - name: demarrer le conteneur docker
        run: docker run -d --name cicd-demo -p 3000:3000 cicdfood

      - name: Attendre l'application
        run: |
          for i in {1..10}; do
            if curl --fail http://localhost:3000/api/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs cicd-demo
          exit 1

      - name: Verifier le calcul TTC
        run: |
          curl --fail "http://localhost:3000/api/calcul/ttc?prix=100&tva=20" \
           | grep '"prixTTC":120'

      - name: Nettoyer le conteneur
        if: always()
        run: docker rm cicd-demo || true

      - name: Preparer le nom de l'image
        run: |
          REPO="${GITHUB_REPOSITORY,,}"
          IMAGE_NAME="ghcr.io/$REPO"
          echo "IMAGE_NAME=$IMAGE_NAME" >> "$GITHUB_ENV"

      - name: Connextion a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tagger l'image validée
        run: |
          docker tag cicdfood "$IMAGE_NAME:${GITHUB_SHA}"
          docker tag cicdfood "$IMAGE_NAME:latest"
          docker image ls "$IMAGE_NAME"

      - name: Publier GHCR
        run: |
          docker push "$IMAGE_NAME:${GITHUB_SHA}"
          docker push "$IMAGE_NAME:latest"
